<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Untuk Kamu ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
    background:
    radial-gradient(circle at center,#57182d,#180811 55%,#050507);
}

.page{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.box{
    max-width:500px;
    z-index:5;
}

.heart{
    font-size:65px;
    margin-bottom:20px;
    animation:detak 1.5s infinite;
    filter:drop-shadow(0 0 20px #ff527c);
}

h1{
    font-size:36px;
    margin-bottom:20px;
}

#text{
    min-height:100px;
    font-size:17px;
    line-height:1.8;
    opacity:.9;
}

button{
    margin-top:25px;
    padding:13px 28px;
    border:0;
    border-radius:30px;
    background:white;
    color:#35101d;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    opacity:0;
    transition:.3s;
}

button.show{
    opacity:1;
}

button:active{
    transform:scale(.94);
}

.float{
    position:fixed;
    bottom:-30px;
    pointer-events:none;
    animation:naik linear forwards;
    z-index:1;
}

@keyframes detak{
    50%{transform:scale(1.15)}
}

@keyframes naik{
    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }
    20%{opacity:.8}
    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="box">

        <div class="heart">❤️</div>

        <h1>Happy Anniversary</h1>

        <div id="text"></div>

        <button id="next"
        onclick="location.href='page2.html'">
            Selanjutnya →
        </button>

    </div>

</div>

<script>

const tulisan =
`Hai kamu ❤️

Hari ini adalah hari yang spesial,
karena kita kembali sampai di
satu tanggal yang berarti buat kita.

Mungkin aku nggak selalu bisa
mengungkapkan semuanya lewat kata-kata,
tapi aku bersyukur banget
bisa melewati hari-hari ini sama kamu.`;

let i=0;
const speed=35;

function ketik(){

    if(i<tulisan.length){

        document.getElementById("text")
        .innerHTML +=
        tulisan.charAt(i)
        .replace(/\n/g,"<br>");

        i++;

        setTimeout(ketik,speed);

    }else{

        document
        .getElementById("next")
        .classList.add("show");

    }

}

ketik();


/* ANIMASI */

function buatFloat(){

    const el=document.createElement("div");

    el.className="float";

    const isi=[
        "❤️","💗","💖",
        "💕","✨","🌸"
    ];

    el.innerHTML=
        isi[Math.floor(Math.random()*isi.length)];

    el.style.left=
        Math.random()*100+"vw";

    el.style.fontSize=
        14+Math.random()*18+"px";

    el.style.animationDuration=
        5+Math.random()*5+"s";

    document.body.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },10000);

}

setInterval(buatFloat,500);

</script>

</body>
</html>
