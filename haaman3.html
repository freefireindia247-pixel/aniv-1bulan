<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Untuk Kamu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
    color:white;
    background:#08050a;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 40%,
        #641a35,
        #1b0912 55%,
        #050507);
}

.glow{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,60,130,.2);
    filter:blur(75px);
    animation:gerak 8s ease-in-out infinite alternate;
}

.glow:nth-child(1){
    top:-100px;
    left:-80px;
}

.glow:nth-child(2){
    right:-100px;
    bottom:-100px;
    animation-delay:2s;
}

@keyframes gerak{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(90px,60px) scale(1.3);
    }
}

/* BINTANG */

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    animation:kelip 2s infinite alternate;
}

@keyframes kelip{
    from{
        opacity:.15;
        transform:scale(.5);
    }
    to{
        opacity:.9;
        transform:scale(1.4);
    }
}

/* KONTEN */

.container{
    position:relative;
    z-index:5;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.box{
    width:100%;
    max-width:480px;
    animation:muncul 1.5s ease;
}

@keyframes muncul{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.heart{
    font-size:70px;
    margin-bottom:20px;
    animation:detak 1.5s infinite;
    filter:drop-shadow(0 0 25px #ff477e);
}

@keyframes detak{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.15);
    }
}

.subtitle{
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:.65;
    margin-bottom:15px;
}

h1{
    font-size:35px;
    margin-bottom:20px;
}

p{
    font-size:16px;
    line-height:1.8;
    opacity:.88;
}

/* BUTTON WHATSAPP */

.wa-button{
    display:inline-block;
    margin-top:30px;
    padding:14px 28px;
    border-radius:50px;
    border:none;
    background:white;
    color:#35101d;
    font-size:16px;
    font-weight:bold;
    text-decoration:none;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 25px rgba(255,255,255,.15);
}

.wa-button:hover{
    transform:scale(1.08);
    box-shadow:0 0 35px rgba(255,100,150,.35);
}

.wa-button:active{
    transform:scale(.94);
}

/* LOVE TERBANG */

.float-love{
    position:absolute;
    bottom:-40px;
    pointer-events:none;
    animation:naik linear forwards;
    z-index:2;
}

@keyframes naik{
    0%{
        transform:translateY(0) rotate(0);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    100%{
        transform:translateY(-115vh) rotate(360deg);
        opacity:0;
    }
}

/* MOBILE */

@media(max-width:500px){
    h1{
        font-size:30px;
    }

    p{
        font-size:15px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">

    <div class="glow"></div>
    <div class="glow"></div>

</div>


<!-- KONTEN -->

<div class="container">

    <div class="box">

        <div class="heart">
            ❤️
        </div>

        <div class="subtitle">
            Sampai di sini dulu...
        </div>

        <h1>
            Happy Anniversary ❤️
        </h1>

        <p>
            Terima kasih sudah menjadi bagian
            dari cerita ini.
            <br><br>

            Semoga masih ada banyak cerita,
            tawa, dan kenangan yang bisa
            kita buat bersama.
            <br><br>

            Dan tetaplah menjadi rumah yang nyaman
            buat aku pulang. ❤️
        </p>


        <!--
        GANTI NOMOR DI BAWAH

        Contoh nomor Indonesia:
        628123456789

        Jangan pakai:
        +62
        0812
        spasi
        atau tanda -
        -->

        <a
            class="wa-button"
            href="https://wa.me/6282185052636?text=Happy%20Anniversary%20%21%20Aku%20udah%20selesai%20lihat%20webnya%20%F0%9F%98%AD%E2%9D%A4%EF%B8%8F"
            target="_blank">

            AKU SAYANG KAMU❤️

        </a>

    </div>

</div>


<script>

/* BIKIN BINTANG */

for(let i=0;i<45;i++){

    const star=document.createElement("div");

    star.className="star";

    star.style.left=
        Math.random()*100+"vw";

    star.style.top=
        Math.random()*100+"vh";

    star.style.animationDelay=
        Math.random()*2+"s";

    document
        .querySelector(".background")
        .appendChild(star);
}


/* LOVE MELAYANG */

function createLove(){

    const love=document.createElement("div");

    love.className="float-love";

    const hearts=[
        "❤️",
        "💗",
        "💖",
        "💕",
        "💓",
        "💞",
        "✨"
    ];

    love.innerHTML=
        hearts[
            Math.floor(
                Math.random()*hearts.length
            )
        ];

    love.style.left=
        Math.random()*100+"vw";

    love.style.fontSize=
        (12+Math.random()*22)+"px";

    love.style.animationDuration=
        (5+Math.random()*5)+"s";

    document.body.appendChild(love);

    setTimeout(()=>{
        love.remove();
    },10000);
}

setInterval(createLove,500);

</script>

</body>
</html>
